name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Version to release (e.g. 0.1.0)"
        required: true

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-26
    env:
      VERSION: ${{ inputs.version || github.ref_name }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4

      - name: Version
        run: |
          v="${VERSION#v}"
          echo "VERSION=$v" >> "$GITHUB_ENV"
          plutil -replace CFBundleShortVersionString -string "$v" macos/Resources/Info.plist
          plutil -replace CFBundleVersion -string "${{ github.run_number }}" macos/Resources/Info.plist

      - name: Rust targets
        run: rustup target add aarch64-apple-darwin x86_64-apple-darwin

      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: cargo-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}

      - name: Test
        run: cargo test --workspace

      - name: uv (for dmgbuild)
        run: brew install uv

      - name: Import signing certificate
        env:
          P12: ${{ secrets.RAYS_SIGNING_P12 }}
          P12_PASSWORD: ${{ secrets.RAYS_SIGNING_PASSWORD }}
        run: |
          if [ -z "$P12" ]; then
            echo "::warning::RAYS_SIGNING_P12 is not set; signing ad hoc, so updates ask for permissions again."
            exit 0
          fi
          kc="$RUNNER_TEMP/signing.keychain-db"
          kp="$(uuidgen)"
          security create-keychain -p "$kp" "$kc"
          security set-keychain-settings -lut 21600 "$kc"
          security unlock-keychain -p "$kp" "$kc"
          printf '%s' "$P12" | base64 --decode > "$RUNNER_TEMP/rays.p12"
          security import "$RUNNER_TEMP/rays.p12" -k "$kc" -P "$P12_PASSWORD" -T /usr/bin/codesign
          rm -f "$RUNNER_TEMP/rays.p12"
          security set-key-partition-list -S apple-tool:,apple: -s -k "$kp" "$kc" > /dev/null
          security list-keychains -d user -s "$kc" $(security list-keychains -d user | tr -d '"')
          echo "RAYS_SIGN_IDENTITY=Rays Release" >> "$GITHUB_ENV"

      - name: Build Rays.app
        run: scripts/bundle-app.sh

      - name: Check signature
        if: env.RAYS_SIGN_IDENTITY != ''
        run: codesign -d -r- bin/Rays.app 2>&1 | grep 'certificate root'

      - name: Package
        run: |
          ditto -c -k --keepParent bin/Rays.app "Rays-${VERSION}.zip"
          scripts/make-dmg.sh "$VERSION"
          cp "Rays-${VERSION}.dmg" Rays.dmg  # fixed name for the releases/latest/download link
          shasum -a 256 "Rays-${VERSION}.zip" | cut -d' ' -f1 > sha256.txt
          echo "SHA256=$(cat sha256.txt)" >> "$GITHUB_ENV"

      - name: Publish release
        run: |
          gh release create "v${VERSION}" "Rays-${VERSION}.zip" "Rays-${VERSION}.dmg" Rays.dmg \
            --title "Rays ${VERSION}" \
            --notes "$(printf 'Download: open Rays-'"${VERSION}"'.dmg and drag Rays to Applications\nInstall with Homebrew: `brew install --cask a6n-ai/tap/rays`\nUpdate: `brew upgrade --cask rays`\nUninstall: `brew uninstall --cask rays` (add `--zap` to also delete settings and history)')"

      - name: Update Homebrew cask
        env:
          TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_GITHUB_TOKEN }}
        run: |
          if [ -z "$TAP_TOKEN" ]; then
            echo "::notice::HOMEBREW_TAP_GITHUB_TOKEN is not shared with this repo; bump the cask by hand. sha256=${SHA256}"
            exit 0
          fi
          git clone "https://x-access-token:${TAP_TOKEN}@github.com/a6n-ai/homebrew-tap.git" tap
          sed -i '' -E "s/^  version \".*\"/  version \"${VERSION}\"/; s/^  sha256 \".*\"/  sha256 \"${SHA256}\"/" tap/Casks/rays.rb
          cd tap
          git config user.name "rays-release"
          git config user.email "rays-release@users.noreply.github.com"
          git commit -am "rays ${VERSION}" && git push
