name: Firefox extension

on:
  push:
    branches: [main]
    paths:
      - "extension/**"
      - "scripts/sign-firefox.sh"
      - ".github/workflows/firefox-extension.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: firefox-extension
  cancel-in-progress: false

jobs:
  sign:
    runs-on: ubuntu-latest
    env:
      EXT_VERSION: 0.1.${{ github.run_number }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check AMO secrets
        id: keys
        env:
          ISSUER: ${{ secrets.AMO_JWT_ISSUER }}
        run: |
          if [ -z "$ISSUER" ]; then
            echo "::notice::Set repo secrets AMO_JWT_ISSUER and AMO_JWT_SECRET to sign the extension."
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Sign on addons.mozilla.org (unlisted)
        if: steps.keys.outputs.ready == 'true'
        env:
          WEB_EXT_API_KEY: ${{ secrets.AMO_JWT_ISSUER }}
          WEB_EXT_API_SECRET: ${{ secrets.AMO_JWT_SECRET }}
        run: scripts/sign-firefox.sh
      - name: Publish signed package
        if: steps.keys.outputs.ready == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "extension-v${EXT_VERSION}" build/firefox/rays.xpi \
            --title "Rays extension ${EXT_VERSION}" \
            --notes "Signed for Firefox and Zen (unlisted, self-distributed)." \
            --latest=false
