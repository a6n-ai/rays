[package]
name = "dl-engine"
version = "0.1.0"
edition = "2024"
license = "AGPL-3.0-only"

[lib]
name = "dl_engine"
crate-type = ["staticlib", "lib"]

[features]
default = ["full"]
# shortcut: `full` off builds only `protocol` (for the CLI); split into a separate crate if more is shared.
full = ["dep:tokio", "dep:reqwest", "dep:rusqlite", "dep:uniffi"]
# Experimental: HTTP/3 (QUIC over UDP) when RAYS_HTTP3=1. Needs RUSTFLAGS="--cfg reqwest_unstable"; off in releases.
http3 = ["full", "reqwest/http3"]

[dependencies]
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tokio = { version = "1.54.1", features = ["rt-multi-thread", "net", "fs", "sync", "time", "macros", "io-util"], optional = true }
reqwest = { version = "0.13.5", default-features = false, features = ["native-tls", "system-proxy"], optional = true }
rusqlite = { version = "0.43.0", optional = true }
uniffi = { version = "0.32.2", optional = true }

[dev-dependencies]
axum = "0.8.9"
sha2 = "0.11.1"
tempfile = "3.27.0"
tokio = { version = "1.54.1", features = ["full"] }
tower-http = { version = "0.7.1", features = ["fs"] }
